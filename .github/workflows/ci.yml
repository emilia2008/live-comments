name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit and WebSocket tests (no Redis needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  compose:
    name: Docker Compose with 2 backends, Redis and nginx
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install websockets==17.2
      - name: Start the stack and wait for health checks
        run: docker compose up -d --build --wait
      - name: Comment, like and viewer count travel between backend1 and backend2
        run: python loadtest/cross_instance_check.py ws://localhost:8001 ws://localhost:8002
      - name: The same through nginx (WebSocket upgrade)
        run: python loadtest/cross_instance_check.py ws://localhost:8080 ws://localhost:8080 --allow-same-instance
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down
