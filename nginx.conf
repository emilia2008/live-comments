# Load balancer in front of the backends, with WebSocket support.

worker_processes auto;
worker_rlimit_nofile 65536;

events {
    # Each proxied WebSocket uses two connections: client -> nginx and nginx -> backend.
    worker_connections 16384;
}

http {
    access_log off;  # thousands of WebSocket connections; keep the disk quiet

    # Send "Connection: upgrade" to the backend only when the client asked for a
    # WebSocket upgrade; plain HTTP requests get "Connection: close".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backends {
        # Round robin: each NEW connection goes to the next backend. A WebSocket then
        # stays on that backend until it closes, so no sticky sessions are needed.
        server backend1:8000;
        server backend2:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backends;

            # WebSocket upgrade: HTTP/1.1 plus the two hop-by-hop headers.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Default is 60 s without data. Quiet rooms must not be cut off.
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
