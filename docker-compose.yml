# Redis + two backend instances + nginx load balancer.
#   http://localhost:8080  -> nginx, spreads WebSocket connections over both backends
#   http://localhost:8001  -> backend1 directly (pin a browser tab to one instance)
#   http://localhost:8002  -> backend2 directly

services:
  redis:
    image: redis:7-alpine
    # Pub/Sub and a short history only; no need to write snapshots to disk.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  backend1:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: backend1
    ports:
      - "8001:8000"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }  # every WebSocket is an open file
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 15

  backend2:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      INSTANCE_ID: backend2
    ports:
      - "8002:8000"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 2s
      retries: 15

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
